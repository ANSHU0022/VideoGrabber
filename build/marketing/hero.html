<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
    background: radial-gradient(1200px 700px at 50% -10%, #2f6df6 0%, #1740b8 45%, #0b1a4d 100%); color: #fff; position: relative; }
  .glow { position: absolute; width: 900px; height: 300px; left: 350px; bottom: 40px; background: radial-gradient(closest-side, rgba(120,170,255,.35), transparent); filter: blur(20px); }
  header { position: absolute; top: 46px; left: 0; right: 0; text-align: center; }
  .brand { display: inline-flex; align-items: center; gap: 14px; }
  .brand img { width: 58px; height: 58px; border-radius: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .brand h1 { font-size: 46px; font-weight: 750; letter-spacing: -.02em; }
  .tag { margin-top: 10px; font-size: 22px; color: rgba(255,255,255,.85); }
  .pills { margin-top: 16px; display: flex; gap: 10px; justify-content: center; }
  .pill { font-size: 14px; font-weight: 650; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); }

  /* MacBook */
  .mac { position: absolute; left: 70px; top: 255px; width: 760px; }
  .mac .lid { background: #0d0d10; border-radius: 22px 22px 8px 8px; padding: 18px 18px 22px; box-shadow: 0 30px 60px rgba(0,0,0,.45), inset 0 0 0 2px #2a2a30; }
  .mac .screen { width: 100%; aspect-ratio: 16/10; border-radius: 6px; overflow: hidden; background: #fff; }
  .mac .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top left; }
  .mac .base { height: 20px; margin: 0 -48px; background: linear-gradient(#cfd2d8, #8e929a); border-radius: 0 0 22px 22px; position: relative; }
  .mac .base::before { content: ""; position: absolute; left: 50%; top: 0; width: 130px; height: 8px; transform: translateX(-50%); background: #a7aab1; border-radius: 0 0 10px 10px; }
  .label { margin-top: 14px; text-align: center; font-size: 17px; font-weight: 650; color: rgba(255,255,255,.9); }
  .label span { font-weight: 500; color: rgba(255,255,255,.65); }

  /* Windows laptop (dark) */
  .win { position: absolute; right: 250px; top: 335px; width: 610px; }
  .win .lid { background: #1b1c22; border-radius: 12px 12px 4px 4px; padding: 12px 12px 16px; box-shadow: 0 30px 60px rgba(0,0,0,.5), inset 0 0 0 2px #33343c; }
  .win .screen { position: relative; width: 100%; aspect-ratio: 16/10; overflow: hidden; background: #161618; }
  .win .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top left; }
  .win .controls { position: absolute; top: 0; right: 0; height: 15px; display: flex; background: #161618; }
  .win .controls i { width: 26px; height: 15px; display: grid; place-items: center; color: #e5e5e5; font-style: normal; font-size: 9px; }
  .win .base { height: 14px; margin: 0 -26px; background: linear-gradient(#3a3c45, #1e1f25); border-radius: 0 0 12px 12px; }

  /* Android phone */
  .phone { position: absolute; right: 80px; top: 214px; width: 286px; }
  .phone .body { background: #111; border-radius: 42px; padding: 12px; box-shadow: 0 30px 60px rgba(0,0,0,.55), inset 0 0 0 2px #2d2d33; }
  .phone .screen { width: 100%; aspect-ratio: 1080/2400; border-radius: 32px; overflow: hidden; background: #000; position: relative; }
  .phone .screen img { width: 100%; height: 100%; object-fit: cover; }
  .phone .cam { position: absolute; top: 10px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #0a0a0a; box-shadow: 0 0 0 2px #1b1b1f; }
</style></head>
<body>
  <div class="glow"></div>
  <header>
    <div class="brand"><img src="../icon.png"><h1>VideoGrabber</h1></div>
    <p class="tag">The HD video downloader for Mac, Windows &amp; Android: any video, up to 4K and 8K.</p>
    <div class="pills"><span class="pill">macOS</span><span class="pill">Windows</span><span class="pill">Android</span><span class="pill">4K · 8K · HDR</span><span class="pill">1000+ sites</span></div>
  </header>

  <div class="mac">
    <div class="lid"><div class="screen"><img src="../../docs/screenshots/desktop-video-light.jpg"></div></div>
    <div class="base"></div>
    <div class="label">macOS <span>· Apple Silicon &amp; Intel</span></div>
  </div>

  <div class="win">
    <div class="lid"><div class="screen"><img src="../../docs/screenshots/desktop-history-dark.jpg"><div class="controls"><i>─</i><i>☐</i><i>✕</i></div></div></div>
    <div class="base"></div>
    <div class="label">Windows <span>· 10 &amp; 11</span></div>
  </div>

  <div class="phone">
    <div class="body"><div class="screen"><img src="../../docs/screenshots/android-4k-dark.jpg"><div class="cam"></div></div></div>
    <div class="label">Android <span>· 10+</span></div>
  </div>
</body></html>
