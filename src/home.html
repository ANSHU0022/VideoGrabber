<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>New Tab</title>
  <style>
    :root { color-scheme: light; --bg: #ffffff; --field: #f0f0f2; --field-hover: #e9e9ec; --border: #e2e2e6;
      --text: #17171a; --text-2: #55555e; --text-3: #8b8b94; --accent: #2463eb; --accent-soft: rgba(36,99,235,.09); --tile: #f6f6f7; }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --bg: #222225; --field: #2b2b2f; --field-hover: #323237; --border: #34343a;
        --text: #f1f1f3; --text-2: #b3b3bb; --text-3: #7d7d87; --accent: #4a86ff; --accent-soft: rgba(74,134,255,.14); --tile: #29292d; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    body { display: flex; justify-content: center; padding-top: 18vh; }
    .wrap { width: min(640px, calc(100vw - 48px)); display: flex; flex-direction: column; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; color: #fff; }
    .brand h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.015em; }
    form { width: 100%; display: flex; align-items: center; height: 48px; border-radius: 12px; background: var(--field);
      border: 1px solid transparent; padding: 0 6px 0 16px; gap: 10px; transition: background .12s, border-color .12s, box-shadow .12s; }
    form:hover { background: var(--field-hover); }
    form:focus-within { background: var(--bg); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    form svg { color: var(--text-3); flex-shrink: 0; }
    input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 15px; }
    input::placeholder { color: var(--text-3); }
    .engines { display: flex; gap: 2px; background: var(--bg); border-radius: 8px; padding: 2px; border: 1px solid var(--border); }
    .engines button { border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 12px; font-weight: 500;
      height: 28px; padding: 0 10px; border-radius: 6px; }
    .engines button:hover { color: var(--text); }
    .engines button.on { background: var(--field); color: var(--text); }
    .grid { margin-top: 36px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; }
    .grid a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--tile);
      color: var(--text); text-decoration: none; font-size: 13px; font-weight: 500; transition: background .12s; }
    .grid a:hover { background: var(--field-hover); }
    .grid i { width: 22px; height: 22px; flex-shrink: 0; background: var(--c, var(--text));
      -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; }
    .grid .mono { --c: var(--text); }
    .grid .ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
    .hint { margin-top: 28px; color: var(--text-3); font-size: 12.5px; text-align: center; }
    kbd { font: inherit; font-size: 11.5px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-2); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 20h14"/></svg></div>
      <h1>VideoGrabber</h1>
    </div>
    <form id="f">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></svg>
      <input id="q" placeholder="Search videos or paste a link" autofocus autocomplete="off" spellcheck="false" />
      <div class="engines" id="engines">
        <button type="button" data-e="youtube">YouTube</button>
        <button type="button" data-e="google">Google</button>
        <button type="button" data-e="vimeo">Vimeo</button>
      </div>
    </form>
    <div class="grid">
      <a href="https://www.youtube.com"><i style="--logo:url(logos/youtube.svg);--c:#FF0000"></i>YouTube</a>
      <a href="https://vimeo.com"><i style="--logo:url(logos/vimeo.svg);--c:#1AB7EA"></i>Vimeo</a>
      <a href="https://www.instagram.com"><i class="ig" style="--logo:url(logos/instagram.svg)"></i>Instagram</a>
      <a href="https://x.com"><i class="mono" style="--logo:url(logos/x.svg)"></i>X</a>
      <a href="https://www.facebook.com/watch"><i style="--logo:url(logos/facebook.svg);--c:#0866FF"></i>Facebook</a>
      <a href="https://www.tiktok.com"><i class="mono" style="--logo:url(logos/tiktok.svg)"></i>TikTok</a>
      <a href="https://www.reddit.com"><i style="--logo:url(logos/reddit.svg);--c:#FF4500"></i>Reddit</a>
      <a href="https://www.dailymotion.com"><i class="mono" style="--logo:url(logos/dailymotion.svg)"></i>Dailymotion</a>
    </div>
    <p class="hint">Open any video and choose a quality in the side panel. <kbd>⌘T</kbd> new tab · <kbd>⌘D</kbd> download</p>
  </div>
  <script>
    const ENGINES = {
      youtube: 'https://www.youtube.com/results?search_query=',
      google: 'https://www.google.com/search?tbm=vid&q=',
      vimeo: 'https://vimeo.com/search?q=',
    };
    let engine = 'youtube';
    try { engine = localStorage.getItem('engine') || engine; } catch {}
    const btns = document.querySelectorAll('#engines button');
    const paint = () => btns.forEach((b) => b.classList.toggle('on', b.dataset.e === engine));
    btns.forEach((b) => (b.onclick = () => { engine = b.dataset.e; try { localStorage.setItem('engine', engine); } catch {} paint(); document.getElementById('q').focus(); }));
    paint();
    if (!/Mac/i.test(navigator.platform)) document.querySelectorAll('kbd').forEach((k) => (k.textContent = k.textContent.replace('⌘', 'Ctrl+')));
    document.getElementById('f').addEventListener('submit', (e) => {
      e.preventDefault();
      const q = document.getElementById('q').value.trim();
      if (!q) return;
      if (/^https?:\/\//i.test(q)) location.href = q;
      else if (/^[^\s]+\.[a-z]{2,}(\/|$)/i.test(q)) location.href = 'https://' + q;
      else location.href = ENGINES[engine] + encodeURIComponent(q);
    });
  </script>
</body>
</html>
